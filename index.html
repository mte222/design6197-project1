<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Successional Forest</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Successional Forest</h1>
  <div class="controls">
    <button id="play">Play</button>
    <button id="step">Step</button>
    <button id="reset">Reset</button>
    <label>
      Speed
      <input id="speed" type="range" min="1" max="30" value="5">
      <span id="speed-label">5</span> steps/sec
    </label>
    <span class="counter">Step: <span id="step-count">0</span></span>
    <span class="counter" id="water-display">Water: <span id="water">0</span> / <span id="water-max">0</span></span>
  </div>
  <div id="readout" class="readout"></div>
  <canvas id="grid"></canvas>

  <script src="settings.js"></script>
  <script src="rules.js"></script>
  <script src="main.js"></script>
</body>
</html>
